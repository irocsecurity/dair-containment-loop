name: Release

# Fires on a signed, annotated tag. Builds the distribution, attaches build
# provenance attestations, and creates a GitHub release. Publishing to PyPI is
# deliberately NOT wired up: that needs a trusted-publisher configuration and a
# conscious decision, not a default.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  verify:
    name: Re-verify before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt ruff==0.15.11 'bandit[toml]==1.7.10'
      - run: ruff check . && ruff format --check .
      - run: bandit -r dair_containment -c pyproject.toml -ll
      - run: python tests/test_loop.py

  build:
    name: Build and attest
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the release
      id-token: write        # provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Build distribution
        run: |
          pip install build==1.2.2
          python -m build
      - name: Generate build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"
      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true
          draft: true          # a human opens the gate; releases are irreversible

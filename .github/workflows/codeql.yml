name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly, so newly published queries find old code.
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze Python
    runs-on: ubuntu-latest
    # Code scanning requires GitHub Advanced Security on private repositories.
    # Skip while private rather than failing every push; this turns itself on
    # when the repository becomes public.
    if: github.event.repository.visibility == 'public'
    permissions:
      security-events: write   # upload findings to the Security tab
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v3

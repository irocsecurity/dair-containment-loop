name: OpenSSF Scorecard

# Publishes a supply-chain posture score. For a security tool this is worth
# having visible: it is the same class of scrutiny the tool asks users to apply
# to their own environment.
on:
  branch_protection_rule:
  schedule:
    - cron: "23 5 * * 2"
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    # Scorecard publishes results and uploads SARIF, both of which need a
    # public repository. Skip while private.
    if: github.event.repository.visibility == 'public'
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # scorecard-action publishes no floating major tag (@v2 does not exist);
      # it must be pinned to an exact release. Dependabot keeps this current.
      - uses: ossf/scorecard-action@v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif

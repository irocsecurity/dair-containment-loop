name: Dependency review

# Blocks a pull request that introduces a dependency with a known vulnerability
# or a license incompatible with Apache-2.0 redistribution.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    # Dependency review needs the dependency graph, which on a private
    # repository requires GitHub Advanced Security. Skip while private rather
    # than failing every pull request; this turns itself on when the
    # repository becomes public, matching codeql.yml.
    if: github.event.repository.visibility == 'public'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-3.0, AGPL-3.0, LGPL-3.0

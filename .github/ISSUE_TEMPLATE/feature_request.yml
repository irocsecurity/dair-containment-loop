name: Feature request
description: Propose a change or addition
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve during an incident?
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations: { required: true }
  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints acknowledged
      options:
        - label: This does not weaken dry-run-by-default or the break-glass guardrail
          required: true
        - label: If it adds a containment action, it also has an undo

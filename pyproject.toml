[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dair-containment-loop"
version = "1.0.0"
description = "Concurrent endpoint isolation and identity containment, implementing the DAIR Containment Loop."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "IROC Security LLC" }]
keywords = ["incident-response", "dfir", "dair", "entra-id", "defender-for-endpoint", "containment"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = ["msal>=1.28.0,<2.0.0", "requests>=2.31.0,<3.0.0"]

[project.urls]
Homepage = "https://github.com/irocsecurity/dair-containment-loop"
Source = "https://github.com/irocsecurity/dair-containment-loop"
Issues = "https://github.com/irocsecurity/dair-containment-loop/issues"

[project.scripts]
dair-contain = "dair_containment.cli:main"

[tool.setuptools.packages.find]
include = ["dair_containment*"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["dair_containment", "tests"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order, B bugbear, UP pyupgrade,
# S bandit-derived security rules, C4 comprehensions, SIM simplify.
select = ["E", "W", "F", "I", "B", "UP", "S", "C4", "SIM"]
ignore = [
    "E501",    # line length is handled by the formatter
    "UP006",   # keep typing.Dict/List: this targets Python 3.9
    "UP007",   # keep Optional[X]: same reason
    "UP045",   # same rule, current code
    "UP035",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # assert is the point of a test

[tool.ruff.format]
quote-style = "double"

[tool.bandit]
exclude_dirs = ["tests", ".venv"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dair-containment-loop"
version = "1.0.0"
description = "Concurrent endpoint isolation and identity containment, implementing the DAIR Containment Loop."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "IROC Security LLC" }]
keywords = ["incident-response", "dfir", "dair", "entra-id", "defender-for-endpoint", "containment"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = ["msal>=1.28.0,<2.0.0", "requests>=2.31.0,<3.0.0"]

[project.urls]
Homepage = "https://github.com/irocsecurity/dair-containment-loop"
Source = "https://github.com/irocsecurity/dair-containment-loop"
Issues = "https://github.com/irocsecurity/dair-containment-loop/issues"

[project.scripts]
dair-contain = "dair_containment.cli:main"

[tool.setuptools.packages.find]
include = ["dair_containment*"]
